name: LibreDWG adapter packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "adapters/libredwg/**"
      - "apps/vscode-extension/src/native-cache.ts"
      - "apps/vscode-extension/src/scene-cache-manager.ts"
      - "apps/vscode-extension/src/scene-engine.ts"
      - "apps/vscode-extension/test/native-cache.test.ts"
      - "apps/vscode-extension/scripts/qualify-extension-host.mjs"
      - "apps/vscode-extension/package.json"
      - "packages/webview/**"
      - "scripts/qualify-windows-native.mjs"
      - "scripts/qualify-windows-vscode-ui.mjs"
      - "scripts/qualify-windows-vscode-ui.test.mjs"
      - ".github/workflows/libredwg-adapter.yml"
      - "LICENSE"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "adapters/libredwg/**"
      - "apps/vscode-extension/src/native-cache.ts"
      - "apps/vscode-extension/src/scene-cache-manager.ts"
      - "apps/vscode-extension/src/scene-engine.ts"
      - "apps/vscode-extension/test/native-cache.test.ts"
      - "apps/vscode-extension/scripts/qualify-extension-host.mjs"
      - "apps/vscode-extension/package.json"
      - "packages/webview/**"
      - "scripts/qualify-windows-native.mjs"
      - "scripts/qualify-windows-vscode-ui.mjs"
      - "scripts/qualify-windows-vscode-ui.test.mjs"
      - ".github/workflows/libredwg-adapter.yml"
      - "LICENSE"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: windows-2025
            target: win32-x64

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        if: runner.os == 'Windows'
        with:
          version: 11.12.0

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            diffutils
            make
            tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build checksum-pinned static adapter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          adapters/libredwg/prepare.sh \
            "$RUNNER_TEMP/dwg-libredwg-build" \
            "$RUNNER_TEMP/libredwg-adapter"

      - name: Run bounded self-diagnosis
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DWG_VIEWER_ADAPTER_PROTOCOL=dwg-engine-adapter/1 \
          DWG_VIEWER_BENCHMARK_PHASE=doctor \
            "$RUNNER_TEMP/libredwg-adapter" doctor

      - name: Create and reproduce GPL source-complete package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node adapters/libredwg/package.mjs \
            --adapter "$RUNNER_TEMP/libredwg-adapter" \
            --libredwg-source "$RUNNER_TEMP/dwg-libredwg-build/libredwg-0.14.tar.xz" \
            --output "$RUNNER_TEMP/dwg-viewer-libredwg-${{ matrix.target }}.tar.gz"
          node adapters/libredwg/package.mjs \
            --adapter "$RUNNER_TEMP/libredwg-adapter" \
            --libredwg-source "$RUNNER_TEMP/dwg-libredwg-build/libredwg-0.14.tar.xz" \
            --output "$RUNNER_TEMP/dwg-viewer-libredwg-${{ matrix.target }}-repeated.tar.gz"
          cmp \
            "$RUNNER_TEMP/dwg-viewer-libredwg-${{ matrix.target }}.tar.gz" \
            "$RUNNER_TEMP/dwg-viewer-libredwg-${{ matrix.target }}-repeated.tar.gz"

      - name: Verify extracted checksums and executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf \
            "$RUNNER_TEMP/dwg-viewer-libredwg-${{ matrix.target }}.tar.gz" \
            -C "$RUNNER_TEMP/extracted"
          package_root=$(find "$RUNNER_TEMP/extracted" -mindepth 1 -maxdepth 1 -type d)
          cd "$package_root"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          bin/libredwg-adapter doctor

      - name: Build, diagnose, reproduce, and verify Windows package
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          runner_temp=$(cygpath -u "$RUNNER_TEMP")
          build_root="$runner_temp/dwg-libredwg-build"
          adapter_path="$runner_temp/libredwg-adapter.exe"
          package_path="$runner_temp/dwg-viewer-libredwg-${{ matrix.target }}.tar.gz"
          repeated_path="$runner_temp/dwg-viewer-libredwg-${{ matrix.target }}-repeated.tar.gz"
          export DWG_VIEWER_TAR
          export DWG_VIEWER_OBJDUMP
          DWG_VIEWER_TAR=$(cygpath -w /usr/bin/tar.exe)
          DWG_VIEWER_OBJDUMP=$(cygpath -w /ucrt64/bin/objdump.exe)
          adapters/libredwg/prepare.sh "$build_root" "$adapter_path"
          DWG_VIEWER_ADAPTER_PROTOCOL=dwg-engine-adapter/1 \
          DWG_VIEWER_BENCHMARK_PHASE=doctor \
            "$adapter_path" doctor
          node adapters/libredwg/package.mjs \
            --adapter "$adapter_path" \
            --libredwg-source "$build_root/libredwg-0.14.tar.xz" \
            --output "$package_path"
          node adapters/libredwg/package.mjs \
            --adapter "$adapter_path" \
            --libredwg-source "$build_root/libredwg-0.14.tar.xz" \
            --output "$repeated_path"
          cmp "$package_path" "$repeated_path"
          mkdir "$runner_temp/extracted"
          tar -xzf "$package_path" -C "$runner_temp/extracted"
          package_root=$(find "$runner_temp/extracted" -mindepth 1 -maxdepth 1 -type d)
          cd "$package_root"
          sha256sum -c SHA256SUMS
          bin/libredwg-adapter.exe doctor

      - name: Install locked host qualification dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter dwg-viewer-vscode package:vsix

      - name: Create private Windows UNC qualification share
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shareName = "DwgViewer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sharePath = Join-Path $env:RUNNER_TEMP "dwg-viewer-unc"
          New-Item -ItemType Directory -Path $sharePath | Out-Null
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          New-SmbShare `
            -Name $shareName `
            -Path $sharePath `
            -FullAccess $account `
            -Temporary | Out-Null
          "DWG_VIEWER_UNC_ROOT=\\localhost\$shareName" >> $env:GITHUB_ENV
          "DWG_VIEWER_UNC_SHARE=$shareName" >> $env:GITHUB_ENV

      - name: Qualify real drive, relative, UNC, Unicode, and cancellation paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/qualify-windows-native.mjs `
            --adapter "$env:RUNNER_TEMP\libredwg-adapter.exe" `
            --fixture "$env:RUNNER_TEMP\dwg-libredwg-build\libredwg-0.14\test\test-data\2000\Line.dwg" `
            --large-fixture "$env:RUNNER_TEMP\dwg-libredwg-build\libredwg-0.14\test\test-data\2018\Dynblocks.dwg" `
            --work-root "$env:RUNNER_TEMP\windows-native-qualification" `
            --unc-root "$env:DWG_VIEWER_UNC_ROOT" `
            --report "$env:RUNNER_TEMP\windows-native-qualification.json"

      - name: Prepare public Unicode Windows UI drawing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drawingRoot = Join-Path $env:RUNNER_TEMP "windows-vscode-ui-input"
          New-Item -ItemType Directory -Path $drawingRoot | Out-Null
          $drawingPath = Join-Path $drawingRoot "A2-013-공개-대체-검증.dwg"
          Copy-Item `
            "$env:RUNNER_TEMP\dwg-libredwg-build\libredwg-0.14\test\test-data\example_2018.dwg" `
            $drawingPath
          "DWG_VIEWER_UI_DRAWING=$drawingPath" >> $env:GITHUB_ENV

      - name: Qualify latest stable VS Code UI at Windows display scales
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/qualify-windows-vscode-ui.mjs `
            --adapter "$env:RUNNER_TEMP\libredwg-adapter.exe" `
            --drawing "$env:DWG_VIEWER_UI_DRAWING" `
            --vsix "$env:GITHUB_WORKSPACE\apps\vscode-extension\dwg-viewer-vscode-0.1.0.vsix" `
            --output-dir "$env:RUNNER_TEMP\windows-vscode-ui-qualification"

      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows'
        with:
          name: dwg-viewer-windows-native-qualification
          path: ${{ runner.temp }}/windows-native-qualification.json
          archive: false
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows'
        with:
          name: dwg-viewer-windows-vscode-ui-qualification
          path: ${{ runner.temp }}/windows-vscode-ui-qualification
          if-no-files-found: warn

      - name: Remove private Windows UNC qualification share
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:DWG_VIEWER_UNC_SHARE) {
            Remove-SmbShare `
              -Name $env:DWG_VIEWER_UNC_SHARE `
              -Force `
              -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-libredwg-${{ matrix.target }}
          path: ${{ runner.temp }}/dwg-viewer-libredwg-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error
