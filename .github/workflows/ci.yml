name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  webview-and-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check adapter packaging
        run: pnpm run check:adapter-package
      - name: Check render protocol
        run: pnpm --filter @menaje/viewer-render-protocol check
      - name: Check Viewer Core contracts
        run: pnpm --filter @menaje/viewer-core check
      - name: Check Viewer UI contracts
        run: pnpm --filter @menaje/viewer-ui check
      - name: Check DWG Scene source
        run: pnpm --filter @dwg-viewer/dwg-scene-source check
      - name: Check Webview
        run: pnpm --filter @dwg-viewer/webview check
      - name: Check VS Code extension
        run: pnpm --filter dwg-viewer-vscode check
      - name: Package VSIX
        run: pnpm --filter dwg-viewer-vscode package:vsix
