<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DWG Scene Cache Viewer</title>
    <link rel="stylesheet" href="./styles.css?v=1.18.0" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">DWG Viewer · Scene Cache v1.18</p>
          <h1>대형 도면 첫 화면 검증기</h1>
        </div>
        <button
          id="viewer-tools-trigger"
          class="viewer-tools-trigger"
          type="button"
          aria-label="도면 도구 펼치기"
          aria-expanded="false"
          aria-controls="viewer-toolbar"
          title="도면 도구"
          hidden
        >
          <span aria-hidden="true">•••</span>
        </button>
        <div id="viewer-toolbar" class="toolbar">
          <nav class="view-controls" aria-label="도면 화면 조절">
            <button type="button" data-view-action="zoom-out" disabled aria-label="축소">−</button>
            <button type="button" data-view-action="fit" disabled>전체 보기</button>
            <button
              id="layers-toggle"
              type="button"
              disabled
              aria-expanded="false"
              aria-controls="layer-panel"
            >
              레이어
            </button>
            <button
              id="fonts-toggle"
              type="button"
              disabled
              aria-expanded="false"
              aria-controls="font-panel"
            >
              글꼴
            </button>
            <button
              id="xrefs-toggle"
              type="button"
              disabled
              aria-expanded="false"
              aria-controls="xref-panel"
            >
              외부 참조
            </button>
            <button
              id="wipeout-toggle"
              type="button"
              disabled
              aria-pressed="false"
              title="WIPEOUT 가림 객체 표시 전환"
            >
              가림 끔
            </button>
            <button
              id="plot-style-toggle"
              type="button"
              disabled
              aria-pressed="false"
              title="배치에 지정된 CTB 출력 스타일 표시 전환"
            >
              출력 스타일
            </button>
            <button type="button" data-view-action="zoom-in" disabled aria-label="확대">+</button>
          </nav>
          <label id="font-file-button" class="file-button secondary">
            SHX 파일
            <input id="font-files" type="file" accept=".shx" multiple />
          </label>
          <label id="cache-picker" class="file-button">
            캐시 선택
            <input id="cache-file" type="file" accept=".cache,.dwg.cache" />
          </label>
          <button id="host-retry" class="host-action" type="button" hidden>
            재시도
          </button>
          <button id="host-rebuild" class="host-action" type="button" hidden>
            캐시 다시 만들기
          </button>
          <button id="host-adapter-setup" class="host-action" type="button" hidden>
            변환기 선택·진단
          </button>
        </div>
      </header>
      <section id="drop-zone" class="viewport">
        <canvas id="image-overlay" aria-hidden="true"></canvas>
        <canvas id="drawing"></canvas>
        <canvas id="text-overlay" aria-hidden="true"></canvas>
        <nav
          id="layout-tabs"
          class="layout-tabs"
          aria-label="모델 및 도면 배치"
          hidden
        ></nav>
        <aside id="layer-panel" class="layer-panel" aria-label="레이어 표시 설정" hidden>
          <div class="layer-panel-heading">
            <strong>레이어</strong>
            <span id="layer-summary"></span>
          </div>
          <input
            id="layer-search"
            type="search"
            placeholder="레이어 이름 검색"
            autocomplete="off"
          />
          <div class="layer-actions">
            <button id="layers-show-all" type="button">전체 켜기</button>
            <button id="layers-hide-all" type="button">전체 끄기</button>
          </div>
          <ul id="layer-list"></ul>
        </aside>
        <aside id="font-panel" class="font-panel" aria-label="도면 글꼴 상태" hidden>
          <div class="font-panel-heading">
            <strong>도면 글꼴</strong>
            <span id="font-summary"></span>
          </div>
          <p id="font-panel-help">
            도면이 요구하는 글꼴을 확인합니다.
          </p>
          <button id="host-font-folder" type="button" hidden>
            글꼴 폴더 추가
          </button>
          <ul id="font-status-list"></ul>
        </aside>
        <aside id="xref-panel" class="xref-panel" aria-label="외부 도면과 이미지 참조 상태" hidden>
          <div class="xref-panel-heading">
            <strong>외부 참조</strong>
            <span id="xref-summary"></span>
          </div>
          <p id="xref-panel-help">
            도면과 이미지의 저장 경로를 먼저 확인하고, 없으면 파일명과 상위 폴더가 많이 일치하는 파일을 찾습니다.
          </p>
          <ul id="xref-status-list"></ul>
        </aside>
        <div class="empty-state">
          <strong>생성된 DWG 캐시를 여기에 놓으세요.</strong>
          <span>원본 DWG는 전송하지 않으며 브라우저가 필요한 범위만 읽습니다.</span>
        </div>
        <div id="status" class="status">캐시를 기다리는 중</div>
      </section>
      <aside id="metrics" aria-live="polite"></aside>
    </main>
    <script type="importmap">
      {
        "imports": {
          "#shx-parser": "./node_modules/@mlightcad/shx-parser/dist/index.es.js"
        }
      }
    </script>
    <script type="module" src="./src/main.mjs?v=1.18.0"></script>
  </body>
</html>
