<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DWG Scene Cache Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">DWG Viewer · Scene Cache v1.11</p>
          <h1>대형 도면 첫 화면 검증기</h1>
        </div>
        <div class="toolbar">
          <nav class="view-controls" aria-label="도면 화면 조절">
            <button type="button" data-view-action="zoom-out" disabled aria-label="축소">−</button>
            <button type="button" data-view-action="fit" disabled>전체 보기</button>
            <button
              id="layers-toggle"
              type="button"
              disabled
              aria-expanded="false"
              aria-controls="layer-panel"
            >
              레이어
            </button>
            <button type="button" data-view-action="zoom-in" disabled aria-label="확대">+</button>
          </nav>
          <label class="file-button secondary">
            SHX 글꼴
            <input id="font-files" type="file" accept=".shx" multiple />
          </label>
          <label id="cache-picker" class="file-button">
            캐시 선택
            <input id="cache-file" type="file" accept=".cache,.dwg.cache" />
          </label>
          <button id="host-retry" class="host-action" type="button" hidden>
            재시도
          </button>
          <button id="host-rebuild" class="host-action" type="button" hidden>
            캐시 다시 만들기
          </button>
        </div>
      </header>
      <section id="drop-zone" class="viewport">
        <canvas id="drawing"></canvas>
        <canvas id="text-overlay" aria-hidden="true"></canvas>
        <aside id="layer-panel" class="layer-panel" aria-label="레이어 표시 설정" hidden>
          <div class="layer-panel-heading">
            <strong>레이어</strong>
            <span id="layer-summary"></span>
          </div>
          <input
            id="layer-search"
            type="search"
            placeholder="레이어 이름 검색"
            autocomplete="off"
          />
          <div class="layer-actions">
            <button id="layers-show-all" type="button">전체 켜기</button>
            <button id="layers-hide-all" type="button">전체 끄기</button>
          </div>
          <ul id="layer-list"></ul>
        </aside>
        <div class="empty-state">
          <strong>생성된 DWG 캐시를 여기에 놓으세요.</strong>
          <span>원본 DWG는 전송하지 않으며 브라우저가 필요한 범위만 읽습니다.</span>
        </div>
        <div id="status" class="status">캐시를 기다리는 중</div>
      </section>
      <aside id="metrics" aria-live="polite"></aside>
    </main>
    <script type="importmap">
      {
        "imports": {
          "#shx-parser": "./node_modules/@mlightcad/shx-parser/dist/index.es.js"
        }
      }
    </script>
    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
